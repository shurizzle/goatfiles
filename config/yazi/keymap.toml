#:schema https://yazi-rs.github.io/schemas/keymap.json
# Only overrides live here. Defaults:
# https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/keymap-default.toml

[mgr]
prepend_keymap = [
  # q and Q swapped compared to the defaults
  { on = "q", run = "quit --no-cwd-file", desc = "Quit without outputting cwd-file" },
  { on = "Q", run = "quit", desc = "Quit the process" },

  { on = ["g", "V"], run = "cd ~/Videos", desc = "Go to ~/Videos" },

  # New tmux window (priority) or WezTerm tab in the CWD, otherwise drop to $SHELL
  { on = "<C-s>", for = "unix", run = 'shell --block -- if [ -n "$TMUX" ]; then tmux new-window -c "$PWD" -e YAZI_ID="$YAZI_ID" -e YAZI_LEVEL="$YAZI_LEVEL"; elif [ -n "$WEZTERM_PANE" ]; then YAZI_ID="$YAZI_ID" YAZI_LEVEL="$YAZI_LEVEL" wezterm cli spawn --cwd "$PWD"; else "$SHELL"; fi', desc = "Open shell here" },
]
