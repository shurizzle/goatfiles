#:schema https://yazi-rs.github.io/schemas/yazi.json
# Only overrides live here. Defaults:
# https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/yazi-default.toml

[opener]
# Same as the default `play`, with mpv first
play = [
  { run = "mpv --force-window -- %s", orphan = true, desc = "Play with mpv" },
  { run = "xdg-open %s1", desc = "Play", for = "linux", orphan = true },
  { run = "open %s", desc = "Play", for = "macos" },
  { run = 'start "" %s1', desc = "Play", for = "windows", orphan = true },
  { run = "termux-open %s1", desc = "Play", for = "android" },
  { run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
  { run = "mediainfo %s1 & pause", block = true, desc = "Show media info", for = "windows" },
]

[open]
prepend_rules = [
  # Folders can be played with mpv from the "Open with" menu (O)
  { mime = "folder/*", use = ["edit", "open", "play", "reveal"] },
]

[plugin]
prepend_previewers = [
  { url = "*.{md,markdown}", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s="$([ "$t" = light ] && echo light || echo dark)" "$1"' },
]
